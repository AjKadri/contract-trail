services:
  ct-pg:
    image: postgres:16-alpine
    container_name: ct-pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${CT_PG_PASSWORD:?Set CT_PG_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ct-pg-data:/var/lib/postgresql/data
      - ../spike/data:/data:ro
    networks:
      - zetaris_default

networks:
  zetaris_default:
    external: true
    name: zetaris_default

volumes:
  ct-pg-data:
